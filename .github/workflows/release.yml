# Builds, verifies and publishes a GitHub Release when a version tag
# (v<major>.<minor>.<patch>[-pre]) is pushed. Only people with write access
# can push tags, so pull-request code never reaches this workflow.
#
# Job 1 (read-only token) checks out the exact tag, runs every automated
# check, builds the zip, generates and verifies the SHA-256 and writes the
# notes. Job 2 is the only job with `contents: write`: it runs no project
# code, only uploads job 1's verified files with the GitHub CLI.
#
# Pre-release tags (with a suffix such as -rc.2) are published as
# pre-releases. Stable tags are created as drafts and must be published by
# hand after the manual checks in docs/releasing.md.
name: Release

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'

jobs:
  build:
    name: Build and verify the release
    runs-on: windows-2025
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Tag matches the Cargo version
        id: version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          if ($tag -notmatch '^v(\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?)$') { throw "not a version tag: $tag" }
          $v = $Matches[1]
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ($cargo -ne $v) { throw "tag $tag does not match the workspace version $cargo" }
          "version=$v" >> $env:GITHUB_OUTPUT
          "prerelease=$([string]($v -match '-'))".ToLower() >> $env:GITHUB_OUTPUT

      - name: Rust toolchain (from rust-toolchain.toml)
        shell: pwsh
        # rust-toolchain.toml asks for "stable"; runner images can carry an
        # older stable than the minimum (rust-version 1.100), so update it.
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update
          rustup show active-toolchain
          rustc --version; cargo --version

      - name: Format, Clippy, workspace tests, release build
        shell: pwsh
        run: ./scripts/check.ps1 full

      - name: Debug build
        shell: pwsh
        run: cargo build --workspace --locked

      - name: Third-party notices are current
        shell: pwsh
        run: ./scripts/third-party-notices.ps1 -Check

      - name: Application checks
        shell: pwsh
        run: ./scripts/app-tests.ps1 -Profile GitHubHosted

      - name: Package, checksum and installer verification
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/package.ps1
          if ($LASTEXITCODE) { exit 1 }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/package-verify.ps1
          if ($LASTEXITCODE) { exit 1 }

      - name: Collect release files and verify the checksum
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $zip = "target/dist/windowsRICE-$v-win-x64.zip"
          if (-not (Test-Path $zip)) { throw "missing $zip" }
          $line = (Get-Content "$zip.sha256" -Raw).Trim()
          if ($line -notmatch '^([0-9A-F]{64})  (\S+)$' -or $Matches[2] -ne (Split-Path $zip -Leaf)) { throw "bad checksum file: $line" }
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash
          if ($actual -ne $Matches[1]) { throw "checksum mismatch: $actual" }
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item $zip, "$zip.sha256" release/
          ./scripts/release-notes.ps1 -Version $v -Zip $zip -Out release/notes.md
          Get-ChildItem release | Format-Table Name, Length

      - name: Keep the application check report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: application-check-results
          path: target/ci/
          if-no-files-found: ignore
          retention-days: 30

      - name: Hand the verified files to the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: release/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download the verified files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release

      - name: Verify the checksum again
        working-directory: release
        run: |
          set -eu
          zip="windowsRICE-${{ needs.build.outputs.version }}-win-x64.zip"
          expected="$(cut -d' ' -f1 "$zip.sha256" | tr 'A-F' 'a-f')"
          actual="$(sha256sum "$zip" | cut -d' ' -f1)"
          test "$expected" = "$actual"
          echo "SHA-256 $actual"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        working-directory: release
        run: |
          set -eu
          kind="--prerelease"
          if [ "$PRERELEASE" != "true" ]; then kind="--draft"; fi
          gh release create "$TAG" \
            --verify-tag \
            $kind \
            --title "windowsRICE $VERSION" \
            --notes-file notes.md \
            "windowsRICE-$VERSION-win-x64.zip" \
            "windowsRICE-$VERSION-win-x64.zip.sha256"
          gh release view "$TAG" --json url,isPrerelease,isDraft,assets --jq '{url, isPrerelease, isDraft, assets: [.assets[].name]}'

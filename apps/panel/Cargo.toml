[package]
name = "windowsrice-panel"
description = "windowsRICE top panel (Phase 4 rendering foundation prototype)"
version.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "windowsrice-panel"
path = "src/main.rs"

[dependencies]
windowsrice-core.workspace = true
windowsrice-theme.workspace = true
windowsrice-ui.workspace = true
windowsrice-render.workspace = true
windowsrice-windows.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
windows-core = "0.62.2"

[dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]

[lints]
workspace = true

# windowsRICE Pastel ??generated by scripts/gen-themes.ps1 from seed colours.

[meta]
schema_version = 1
id = "windowsrice-pastel"
name = "windowsRICE Pastel"
description = "Soft lilac paper tones with a calm purple accent."
author = "windowsRICE"
version = "1.0.0"
default_mode = "light"
accent_source = "theme"
tags = ["light"]

[palette.light]
background = "#F4EEF8"
surface_base = "#EDE7F1"
surface_raised = "#E5DFE9"
surface_overlay = "#DED8E2"
border_subtle = "#00000014"
border_control = "#00000075"
text_primary = "#2A2233"
text_secondary = "#4E4656"
text_muted = "#5B5362"
text_disabled = "#A7A0AD"
text_on_accent = "#FFFFFF"
accent = "#7A4FB3"
accent_hover = "#6B469E"
accent_pressed = "#5F3E8C"
selection = "#D4C5E6"
focus_ring = "#7A4FB3"
success = "#2E7D4F"
warning = "#8A5D00"
danger = "#B23A3A"
info = "#2F6E96"
shadow = "#00000018"

[typography]
family = "Segoe UI Variable"
fallback = ["Malgun Gothic"]
mono_family = "Cascadia Code"
mono_fallback = ["Consolas", "Malgun Gothic"]
weight_regular = 400
weight_emphasis = 500
weight_strong = 500
line_height = 1.4

[typography.sizes]
caption = 11
body = 13
body_large = 14
subtitle = 15
title = 18
display = 24

[spacing]
unit = 4
xs = 4
sm = 8
md = 12
lg = 16
xl = 24
xxl = 32

[radius]
control = 12
menu = 12
card = 12
panel = 0
dock = 12
window = 12

[shadow]
offset_y = 2
blur = 8

[materials]
backdrop = "none"
surface_opacity = 1

[motion]
level = "full"
duration_fast_ms = 100
duration_normal_ms = 160
duration_slow_ms = 240
easing = [0.2, 0.0, 0.0, 1.0]

[components.bar]
position = "top"
height = 36
floating = false
margin = 0
padding_x = 12

[components.dock]
position = "bottom"
icon_size = 40
spacing = 4
padding = 6
auto_hide = "always"
magnification = false
magnification_scale = 1.0

[components.launcher]
width = 600
max_results = 7
top_offset_percent = 30

[components.widget]
padding = 12
gap = 8

[components.window]
border_width = 1
corner = "round_small"
accent_border_on_focus = false

[typography.sizes]
caption = 11
body = 13
body_large = 14
subtitle = 15
title = 18
display = 24

[spacing]
unit = 4
xs = 4
sm = 8
md = 12
lg = 16
xl = 24
xxl = 32

[radius]
control = 8
menu = 8
card = 8
panel = 0
dock = 12
window = 8

[shadow]
offset_y = 2
blur = 8

[materials]
backdrop = "none"
surface_opacity = 1

[motion]
level = "full"

# windowsRICE Midnight ??generated by scripts/gen-themes.ps1 from seed colours.

[meta]
schema_version = 1
id = "windowsrice-midnight"
name = "windowsRICE Midnight"
description = "Deep navy surfaces with a cool violet accent."
author = "windowsRICE"
version = "1.0.0"
default_mode = "dark"
accent_source = "theme"
tags = ["dark"]

[palette.dark]
background = "#0B1020"
surface_base = "#131827"
surface_raised = "#1B2030"
surface_overlay = "#232837"
border_subtle = "#FFFFFF14"
border_control = "#FFFFFF66"
text_primary = "#E6E8F5"
text_secondary = "#BFC2CF"
text_muted = "#B1B4C2"
text_disabled = "#5E6271"
text_on_accent = "#101114"
accent = "#8C7CF0"
accent_hover = "#9C8EF2"
accent_pressed = "#8475E2"
selection = "#2D2C56"
focus_ring = "#8C7CF0"
success = "#7FC79A"
warning = "#E2B868"
danger = "#EC8C8C"
info = "#8DBEE6"
shadow = "#00000040"

[typography]
family = "Segoe UI Variable"
fallback = ["Malgun Gothic"]
mono_family = "Cascadia Code"
mono_fallback = ["Consolas", "Malgun Gothic"]
weight_regular = 400
weight_emphasis = 500
weight_strong = 500
line_height = 1.4

[typography.sizes]
caption = 11
body = 13
body_large = 14
subtitle = 15
title = 18
display = 24

[spacing]
unit = 4
xs = 4
sm = 8
md = 12
lg = 16
xl = 24
xxl = 32

[radius]
control = 6
menu = 6
card = 8
panel = 0
dock = 12
window = 6

[shadow]
offset_y = 2
blur = 8

[materials]
backdrop = "none"
surface_opacity = 1

[motion]
level = "full"
duration_fast_ms = 100
duration_normal_ms = 160
duration_slow_ms = 240
easing = [0.2, 0.0, 0.0, 1.0]

[components.bar]
position = "top"
height = 34
floating = false
margin = 0
padding_x = 12

[components.dock]
position = "bottom"
icon_size = 40
spacing = 4
padding = 6
auto_hide = "always"
magnification = false
magnification_scale = 1.0

[components.launcher]
width = 600
max_results = 7
top_offset_percent = 30

[components.widget]
padding = 12
gap = 8

[components.window]
border_width = 1
corner = "round_small"
accent_border_on_focus = false

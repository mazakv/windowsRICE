# windowsRICE Neon ??generated by scripts/gen-themes.ps1 from seed colours.

[meta]
schema_version = 1
id = "windowsrice-neon"
name = "windowsRICE Neon"
description = "Near-black surfaces with an electric magenta accent."
author = "windowsRICE"
version = "1.0.0"
default_mode = "dark"
accent_source = "theme"
tags = ["dark"]

[palette.dark]
background = "#0A0A12"
surface_base = "#12121A"
surface_raised = "#1B1B24"
surface_overlay = "#24232C"
border_subtle = "#FFFFFF14"
border_control = "#FFFFFF66"
text_primary = "#F2F0FF"
text_secondary = "#C9C7D5"
text_muted = "#BAB9C6"
text_disabled = "#62616C"
text_on_accent = "#101114"
accent = "#FF4FD8"
accent_hover = "#FF68DD"
accent_pressed = "#F04ACB"
selection = "#4A1C45"
focus_ring = "#FF4FD8"
success = "#7FC79A"
warning = "#E2B868"
danger = "#EC8C8C"
info = "#8DBEE6"
shadow = "#00000040"

[typography]
family = "Segoe UI Variable"
fallback = ["Malgun Gothic"]
mono_family = "Cascadia Code"
mono_fallback = ["Consolas", "Malgun Gothic"]
weight_regular = 400
weight_emphasis = 500
weight_strong = 500
line_height = 1.4

[typography.sizes]
caption = 11
body = 13
body_large = 14
subtitle = 15
title = 18
display = 24

[spacing]
unit = 4
xs = 4
sm = 8
md = 12
lg = 16
xl = 24
xxl = 32

[radius]
control = 4
menu = 6
card = 8
panel = 0
dock = 12
window = 4

[shadow]
offset_y = 2
blur = 8

[materials]
backdrop = "none"
surface_opacity = 1

[motion]
level = "full"
duration_fast_ms = 100
duration_normal_ms = 160
duration_slow_ms = 240
easing = [0.2, 0.0, 0.0, 1.0]

[components.bar]
position = "top"
height = 34
floating = false
margin = 0
padding_x = 12

[components.dock]
position = "bottom"
icon_size = 40
spacing = 4
padding = 6
auto_hide = "always"
magnification = false
magnification_scale = 1.0

[components.launcher]
width = 600
max_results = 7
top_offset_percent = 30

[components.widget]
padding = 12
gap = 8

[components.window]
border_width = 1
corner = "round_small"
accent_border_on_focus = false

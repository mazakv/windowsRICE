# windowsRICE High Contrast ??generated by scripts/gen-themes.ps1 from seed colours.

[meta]
schema_version = 1
id = "windowsrice-high-contrast"
name = "windowsRICE High Contrast"
description = "Maximum contrast: pure black or white with a strong yellow or blue accent."
author = "windowsRICE"
version = "1.0.0"
default_mode = "dark"
accent_source = "theme"
tags = ["dark", "light", "accessible"]

[palette.dark]
background = "#000000"
surface_base = "#090909"
surface_raised = "#131313"
surface_overlay = "#1C1C1C"
border_subtle = "#FFFFFF14"
border_control = "#FFFFFF66"
text_primary = "#FFFFFF"
text_secondary = "#D2D2D2"
text_muted = "#C2C2C2"
text_disabled = "#616161"
text_on_accent = "#101114"
accent = "#FFE500"
accent_hover = "#FFE924"
accent_pressed = "#F0D700"
selection = "#423C00"
focus_ring = "#FFE500"
success = "#7FC79A"
warning = "#E2B868"
danger = "#EC8C8C"
info = "#8DBEE6"
shadow = "#00000040"

[palette.light]
background = "#FFFFFF"
surface_base = "#F6F6F6"
surface_raised = "#ECECEC"
surface_overlay = "#E3E3E3"
border_subtle = "#00000014"
border_control = "#00000075"
text_primary = "#000000"
text_secondary = "#2D2D2D"
text_muted = "#3D3D3D"
text_disabled = "#9E9E9E"
text_on_accent = "#FFFFFF"
accent = "#0037A8"
accent_hover = "#003094"
accent_pressed = "#002B83"
selection = "#BDCBE8"
focus_ring = "#0037A8"
success = "#2E7D4F"
warning = "#8A5D00"
danger = "#B23A3A"
info = "#2F6E96"
shadow = "#00000018"

[typography]
family = "Segoe UI Variable"
fallback = ["Malgun Gothic"]
mono_family = "Cascadia Code"
mono_fallback = ["Consolas", "Malgun Gothic"]
weight_regular = 400
weight_emphasis = 500
weight_strong = 500
line_height = 1.4

[typography.sizes]
caption = 11
body = 13
body_large = 14
subtitle = 15
title = 18
display = 24

[spacing]
unit = 4
xs = 4
sm = 8
md = 12
lg = 16
xl = 24
xxl = 32

[radius]
control = 2
menu = 6
card = 8
panel = 0
dock = 12
window = 4

[shadow]
offset_y = 2
blur = 8

[materials]
backdrop = "none"
surface_opacity = 1

[motion]
level = "full"
duration_fast_ms = 100
duration_normal_ms = 160
duration_slow_ms = 240
easing = [0.2, 0.0, 0.0, 1.0]

[components.bar]
position = "top"
height = 36
floating = false
margin = 0
padding_x = 12

[components.dock]
position = "bottom"
icon_size = 40
spacing = 4
padding = 6
auto_hide = "always"
magnification = false
magnification_scale = 1.0

[components.launcher]
width = 600
max_results = 7
top_offset_percent = 30

[components.widget]
padding = 12
gap = 8

[components.window]
border_width = 1
corner = "round_small"
accent_border_on_focus = false

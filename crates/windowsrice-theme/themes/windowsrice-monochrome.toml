# windowsRICE Monochrome ??generated by scripts/gen-themes.ps1 from seed colours.

[meta]
schema_version = 1
id = "windowsrice-monochrome"
name = "windowsRICE Monochrome"
description = "Black, white and grays only."
author = "windowsRICE"
version = "1.0.0"
default_mode = "dark"
accent_source = "theme"
tags = ["dark", "light"]

[palette.dark]
background = "#111111"
surface_base = "#191919"
surface_raised = "#222222"
surface_overlay = "#2A2A2A"
border_subtle = "#FFFFFF14"
border_control = "#FFFFFF66"
text_primary = "#F2F2F2"
text_secondary = "#CACACA"
text_muted = "#BCBCBC"
text_disabled = "#666666"
text_on_accent = "#101114"
accent = "#D0D0D0"
accent_hover = "#D7D7D7"
accent_pressed = "#C4C4C4"
selection = "#434343"
focus_ring = "#D0D0D0"
success = "#7FC79A"
warning = "#E2B868"
danger = "#EC8C8C"
info = "#8DBEE6"
shadow = "#00000040"

[palette.light]
background = "#F4F4F4"
surface_base = "#ECECEC"
surface_raised = "#E3E3E3"
surface_overlay = "#DBDBDB"
border_subtle = "#00000014"
border_control = "#00000075"
text_primary = "#111111"
text_secondary = "#393939"
text_muted = "#484848"
text_disabled = "#9E9E9E"
text_on_accent = "#FFFFFF"
accent = "#2B2B2B"
accent_hover = "#262626"
accent_pressed = "#222222"
selection = "#C0C0C0"
focus_ring = "#2B2B2B"
success = "#2E7D4F"
warning = "#8A5D00"
danger = "#B23A3A"
info = "#2F6E96"
shadow = "#00000018"

[typography]
family = "Segoe UI Variable"
fallback = ["Malgun Gothic"]
mono_family = "Cascadia Code"
mono_fallback = ["Consolas", "Malgun Gothic"]
weight_regular = 400
weight_emphasis = 500
weight_strong = 500
line_height = 1.4

[typography.sizes]
caption = 11
body = 13
body_large = 14
subtitle = 15
title = 18
display = 24

[spacing]
unit = 4
xs = 4
sm = 8
md = 12
lg = 16
xl = 24
xxl = 32

[radius]
control = 2
menu = 6
card = 8
panel = 0
dock = 12
window = 4

[shadow]
offset_y = 2
blur = 8

[materials]
backdrop = "none"
surface_opacity = 1

[motion]
level = "full"
duration_fast_ms = 100
duration_normal_ms = 160
duration_slow_ms = 240
easing = [0.2, 0.0, 0.0, 1.0]

[components.bar]
position = "top"
height = 32
floating = false
margin = 0
padding_x = 12

[components.dock]
position = "bottom"
icon_size = 40
spacing = 4
padding = 6
auto_hide = "always"
magnification = false
magnification_scale = 1.0

[components.launcher]
width = 600
max_results = 7
top_offset_percent = 30

[components.widget]
padding = 12
gap = 8

[components.window]
border_width = 1
corner = "round_small"
accent_border_on_focus = false

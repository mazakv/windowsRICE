# Phase 3.5 UI framework spike. EXPERIMENTAL — not part of the production
# workspace, not a product, not for distribution.
#
# This is a separate Cargo workspace with its own Cargo.lock so that neither
# candidate framework becomes a dependency of the production crates.

[workspace]
resolver = "3"
members = ["common", "slint-bar", "d2d-bar", "shot"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
publish = false

[workspace.dependencies]
spike-common = { path = "common" }
windowsrice-theme = { path = "../../crates/windowsrice-theme" }
serde_json = "1.0.154"

[workspace.dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
lto = "thin"
codegen-units = 1
